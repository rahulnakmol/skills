<button
  type="button"
  class="icon-btn theme-toggle chiplift"
  aria-label="Toggle color theme"
  x-data="{}"
  x-on:click="
    var root = document.documentElement;
    var current = root.getAttribute('data-theme') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tqn-theme', next); } catch (e) {}
  "
>
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path></svg>
</button>

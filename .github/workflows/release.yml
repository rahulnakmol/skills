name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    if: contains(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-plugin-version.mjs
      - run: node scripts/validate.mjs

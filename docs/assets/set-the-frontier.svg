<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="400" fill="#FAF9F5"/>
  <text x="480" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#262625">Set the frontier</text>
  <text x="480" y="80" text-anchor="middle" font-size="15" fill="#6b6b67">Redefining growth with human judgment and trusted AI agents</text>

  <!-- barbell bar -->
  <rect x="270" y="188" width="420" height="46" rx="8" fill="#F0EEE9" stroke="#d8d5cd"/>
  <text x="480" y="208" text-anchor="middle" font-size="13" fill="#8a8a86">Routine execution and information access</text>
  <text x="480" y="226" text-anchor="middle" font-size="13" fill="#8a8a86">— the new baseline, not the differentiator</text>

  <!-- left plate: human judgment -->
  <rect x="80" y="130" width="190" height="160" rx="14" fill="#C96442"/>
  <text x="175" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Encoded human</text>
  <text x="175" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">judgment</text>
  <text x="175" y="215" text-anchor="middle" font-size="12.5" fill="#F7E4DB">Grill loops · gates</text>
  <text x="175" y="234" text-anchor="middle" font-size="12.5" fill="#F7E4DB">Work-item contracts</text>
  <text x="175" y="253" text-anchor="middle" font-size="12.5" fill="#F7E4DB">Routing rubrics</text>
  <text x="175" y="272" text-anchor="middle" font-size="12.5" fill="#F7E4DB">Governance tiers</text>

  <!-- right plate: trusted agents -->
  <rect x="690" y="130" width="190" height="160" rx="14" fill="#40668C"/>
  <text x="785" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Trusted, verified</text>
  <text x="785" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">execution</text>
  <text x="785" y="215" text-anchor="middle" font-size="12.5" fill="#DCE6F2">Separate verifiers</text>
  <text x="785" y="234" text-anchor="middle" font-size="12.5" fill="#DCE6F2">Provider policy in CI</text>
  <text x="785" y="253" text-anchor="middle" font-size="12.5" fill="#DCE6F2">Sandboxed shakedowns</text>
  <text x="785" y="272" text-anchor="middle" font-size="12.5" fill="#DCE6F2">Evidence, not assertion</text>

  <text x="175" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#C96442">Grows scarcer — and more valuable</text>
  <text x="785" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#40668C">Fluency expected of every skill</text>

  <rect x="250" y="352" width="460" height="32" rx="16" fill="#262625"/>
  <text x="480" y="373" text-anchor="middle" font-size="14" fill="#FAF9F5">Value concentrates at the two ends — the middle is commoditized</text>
</svg>

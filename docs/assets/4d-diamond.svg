<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="900" height="700" fill="#FAF9F5"/>
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#262625">The 4D Diamond — Discover, Define, Design, Deliver</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#8a8a86">Orthogonal to the four human gates: how a skill matures its own work between signoffs</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a86"/>
    </marker>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FBDCC4"/>
      <stop offset="35%" stop-color="#E08B5B"/>
      <stop offset="100%" stop-color="#2C4A66"/>
    </radialGradient>
    <linearGradient id="facetNW" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#345A7D"/>
      <stop offset="100%" stop-color="#F4B98F"/>
    </linearGradient>
    <linearGradient id="facetNE" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2E5170"/>
      <stop offset="100%" stop-color="#F4B98F"/>
    </linearGradient>
    <linearGradient id="facetSE" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24405A"/>
      <stop offset="100%" stop-color="#EFA478"/>
    </linearGradient>
    <linearGradient id="facetSW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A4966"/>
      <stop offset="100%" stop-color="#EFA478"/>
    </linearGradient>
    <filter id="elevation" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#262625" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ground shadow, reinforcing the raised summit -->
  <ellipse cx="450" cy="600" rx="150" ry="18" fill="#262625" opacity="0.10"/>

  <!-- the gem body: four shaded facets converging on the summit -->
  <g filter="url(#elevation)">
    <polygon points="450,150 650,370 450,370" fill="url(#facetNE)"/>
    <polygon points="650,370 450,590 450,370" fill="url(#facetSE)"/>
    <polygon points="450,590 250,370 450,370" fill="url(#facetSW)"/>
    <polygon points="250,370 450,150 450,370" fill="url(#facetNW)"/>
    <polygon points="450,150 650,370 450,590 250,370" fill="none" stroke="#262625" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- facet ridge lines, vertices to summit -->
  <line x1="450" y1="150" x2="450" y2="370" stroke="#FAF9F5" stroke-width="1.5" opacity="0.55"/>
  <line x1="650" y1="370" x2="450" y2="370" stroke="#FAF9F5" stroke-width="1.5" opacity="0.55"/>
  <line x1="450" y1="590" x2="450" y2="370" stroke="#FAF9F5" stroke-width="1.5" opacity="0.55"/>
  <line x1="250" y1="370" x2="450" y2="370" stroke="#FAF9F5" stroke-width="1.5" opacity="0.55"/>

  <!-- outer edges, flowing clockwise -->
  <path d="M 450 150 L 650 370" fill="none" stroke="#262625" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M 650 370 L 450 590" fill="none" stroke="#262625" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M 450 590 L 250 370" fill="none" stroke="#262625" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M 250 370 L 450 150" fill="none" stroke="#262625" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.55"/>

  <!-- edge labels -->
  <text x="578" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40668C">Discover → Define</text>
  <text x="578" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40668C">Define → Design</text>
  <text x="322" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40668C">Design → Deliver</text>
  <text x="322" y="245" text-anchor="middle" font-size="11.5" fill="#8a8a86">variance loops back</text>

  <!-- the summit: an enriched, accomplished point, catching the most light -->
  <circle cx="450" cy="370" r="38" fill="url(#gemGlow)" filter="url(#elevation)"/>
  <circle cx="450" cy="370" r="38" fill="none" stroke="#FAF9F5" stroke-width="1.5" opacity="0.6"/>
  <text x="450" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#262625">summit</text>
  <text x="450" y="381" text-anchor="middle" font-size="9.5" fill="#3c2a1e">enriched, accomplished</text>

  <!-- vertices -->
  <circle cx="450" cy="150" r="6" fill="#262625"/>
  <circle cx="650" cy="370" r="6" fill="#262625"/>
  <circle cx="450" cy="590" r="6" fill="#262625"/>
  <circle cx="250" cy="370" r="6" fill="#262625"/>

  <!-- vertex labels -->
  <text x="450" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#262625">Discover</text>
  <text x="450" y="142" text-anchor="middle" font-size="11" fill="#6b6b67">what must be accomplished</text>

  <text x="668" y="366" text-anchor="start" font-size="17" font-weight="700" fill="#262625">Define</text>
  <text x="668" y="384" text-anchor="start" font-size="11" fill="#6b6b67">the baseline and its</text>
  <text x="668" y="398" text-anchor="start" font-size="11" fill="#6b6b67">execution shape</text>

  <text x="450" y="624" text-anchor="middle" font-size="17" font-weight="700" fill="#262625">Design</text>
  <text x="450" y="641" text-anchor="middle" font-size="11" fill="#6b6b67">the path, with tradeoffs shown</text>

  <text x="232" y="366" text-anchor="end" font-size="17" font-weight="700" fill="#262625">Deliver</text>
  <text x="232" y="384" text-anchor="end" font-size="11" fill="#6b6b67">exactly the baseline,</text>
  <text x="232" y="398" text-anchor="end" font-size="11" fill="#6b6b67">with completeness</text>

  <text x="450" y="674" text-anchor="middle" font-size="12" fill="#8a8a86">Every real-work skill runs this cycle — the four facets converge on and</text>
  <text x="450" y="690" text-anchor="middle" font-size="12" fill="#8a8a86">elevate one summit: the baseline, enriched and accomplished together</text>
</svg>
